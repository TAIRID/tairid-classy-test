name: Audit rerun - ASD and ETDD compact summaries

on:
  push:
    paths:
      - '.github/workflows/audit-rerun-asd-etdd-compact.yml'
  workflow_dispatch:

jobs:
  audit-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas matplotlib openpyxl
      - name: Run ASD historical script unchanged
        run: python run_tairid_asd_eye_tracking_response_shape_replication_v1.py
      - name: Run ETDD70 response-shape historical script unchanged
        run: python run_tairid_etdd70_response_shape_v3.py
      - name: Run ETDD70 viability historical script unchanged
        run: python run_tairid_etdd70_viability_window_v2.py
      - name: Collect compact audit files
        run: |
          mkdir -p audit_compact
          cp tairid_asd_eye_tracking_response_shape_replication_v1_outputs/asd_eye_tracking_response_shape_replication_v1_summary.json audit_compact/
          cp tairid_asd_eye_tracking_response_shape_replication_v1_outputs/asd_et_model_results.csv audit_compact/
          cp tairid_asd_eye_tracking_response_shape_replication_v1_outputs/asd_et_permutation_results.csv audit_compact/
          cp tairid_etdd70_response_shape_v3_outputs/etdd70_response_shape_v3_summary.json audit_compact/
          cp tairid_etdd70_response_shape_v3_outputs/etdd70_response_shape_analysis_v3.json audit_compact/
          cp tairid_etdd70_viability_window_v2_outputs/etdd70_viability_window_v2_summary.json audit_compact/
          cp tairid_etdd70_viability_window_v2_outputs/etdd70_vw2_analysis.json audit_compact/
      - uses: actions/upload-artifact@v4
        with:
          name: audit-asd-etdd-compact
          path: audit_compact/**
          if-no-files-found: error
