name: Audit - Neurotype fold-contained reference sensitivity v1

on:
  push:
    paths:
      - '.github/workflows/audit-neurotype-nested-reference-sensitivity-v1.yml'
      - 'run_tairid_neurotype_nested_reference_sensitivity_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-reference-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install empirical replay dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas matplotlib openpyxl
      - name: Compile sensitivity script
        run: python -m py_compile run_tairid_neurotype_nested_reference_sensitivity_v1.py
      - name: Rebuild raw datasets and run fold-contained sensitivity
        run: python -u run_tairid_neurotype_nested_reference_sensitivity_v1.py
      - name: Save sensitivity outputs, even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-neurotype-nested-reference-sensitivity-v1-output
          path: tairid_neurotype_nested_reference_sensitivity_v1_outputs/**
          if-no-files-found: warn
