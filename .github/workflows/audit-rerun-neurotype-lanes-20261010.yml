name: Audit rerun - TAIRID ADHD Mood Schizotypal lanes

on:
  push:
    paths:
      - '.github/workflows/audit-rerun-neurotype-lanes-20261010.yml'
  workflow_dispatch:

jobs:
  audit-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas matplotlib openpyxl
      - name: Run ADHD historical script unchanged
        run: python run_tairid_adhd_inhibition_cycle_reach_v1.py
      - name: Run mood historical script unchanged
        run: python run_tairid_mood_actigraphy_phase_cycling_v1.py
      - name: Run schizotypal historical script unchanged
        run: python run_tairid_schizotypal_semantic_reach_cycle_v2.py
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: audit-neurotype-lanes-20261010
          path: |
            tairid_adhd_inhibition_cycle_reach_v1_outputs/**
            tairid_mood_actigraphy_phase_cycling_v1_outputs/**
            tairid_schizotypal_semantic_reach_cycle_v2_outputs/**
          if-no-files-found: error