name: Audit rerun - TAIRID cross neurotype cycle reach v1

on:
  push:
    paths:
      - '.github/workflows/audit-rerun-cross-neurotype-cycle-reach-v1.yml'
  workflow_dispatch:

jobs:
  audit-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas matplotlib openpyxl
      - name: Run historical analysis script unchanged
        run: python run_tairid_cross_neurotype_cycle_reach_axis_v1.py
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: audit-cross-neurotype-cycle-reach-v1-output
          path: tairid_cross_neurotype_cycle_reach_axis_v1_outputs/**
          if-no-files-found: error