name: Audit - NREF-2 paired reference-scope sensitivity

on:
  push:
    paths:
      - '.github/workflows/audit-neurotype-paired-reference-sensitivity-v2.yml'
      - 'run_tairid_neurotype_paired_reference_sensitivity_v2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas matplotlib openpyxl
      - name: Compile NREF-2 script
        run: python -m py_compile run_tairid_neurotype_paired_reference_sensitivity_v2.py
      - name: Run NREF-2 paired reference scope audit
        run: python -u run_tairid_neurotype_paired_reference_sensitivity_v2.py
      - name: Archive results or failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nref2-paired-reference-sensitivity-v2
          path: tairid_neurotype_paired_reference_sensitivity_v2_outputs/**
          if-no-files-found: warn
